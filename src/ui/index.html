<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>labsign</title>
<style>
  /* Visual sóbrio de ferramenta de documento: cinzas neutros, cantos quase retos,
     um único acento (o azul-marinho da tinta) e movimento só para indicar estado. */
  :root {
    color-scheme: light;
    --bg: #f3f4f6;
    --panel: #ffffff;
    --desk: #e5e7eb;
    --paper: #ffffff;
    --text: #15171c;
    --muted: #5a606c;
    --line: #e1e4e9;
    --line-strong: #858b96;  /* borda de controle: 3.4:1 no painel, 3.1:1 no fundo */
    --hover: #f1f3f6;
    --accent: #0d1a59;
    --accent-hover: #182a7a;
    --accent-ink: #ffffff;
    --accent-soft: #eaedf6;
    --ink-ui: #2a44c8;       /* controles desenhados sobre o papel */
    --ok: #136c43;
    --ok-bg: #e5f2ea;
    --warn: #7c5200;
    --warn-bg: #f7efdc;
    --info-bg: #eaedf6;
    --err: #a8231b;
    --err-ink: #ffffff;      /* texto sobre --err */
    --err-bg: #f8e5e3;
    --swatch-ring: rgba(255, 255, 255, 0.18);
    --radius: 3px;
    --radius-sm: 2px;
    --shadow-page: 0 1px 2px rgba(15, 18, 25, 0.1), 0 8px 24px -8px rgba(15, 18, 25, 0.25);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --topbar-h: 52px;
    /* escala tipográfica: 5 degraus; o resto da hierarquia vem do peso */
    --fs-xs: 12px;
    --fs-sm: 13.5px;
    --fs-md: 15px;
    --fs-lg: 17px;
    --fs-xl: 21px;
  }
  /* Escuro: segue o sistema, salvo quando o app de chat manda o tema (data-theme).
     Os dois blocos abaixo têm os mesmos valores — mudou um, mude o outro. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #101216;
      --panel: #16181d;
      --desk: #0b0c0f;
      --text: #e7e9ee;
      --muted: #9ba2ae;
      --line: #252930;
      --line-strong: #686e79;  /* 3.5:1 no painel, 3.2:1 no hover */
      --hover: #1d2026;
      --accent: #b4c2f5;
      --accent-hover: #cad4f8;
      --accent-ink: #0d1020;
      --accent-soft: #1d2336;
      --ok: #6fcf97;
      --ok-bg: #16261d;
      --warn: #e6b457;
      --warn-bg: #2a2416;
      --info-bg: #1b2030;
      --err: #f28b82;
      --err-ink: #1f0d0b;      /* branco sobre #f28b82 dava 2.4:1; este dá 7.8:1 */
      --err-bg: #2f1d1c;
      --swatch-ring: var(--line-strong); /* azul-marinho e preto somem no painel escuro sem o contorno */
      --shadow-page: 0 1px 2px rgba(0, 0, 0, 0.5), 0 14px 40px -10px rgba(0, 0, 0, 0.75);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #101216;
    --panel: #16181d;
    --desk: #0b0c0f;
    --text: #e7e9ee;
    --muted: #9ba2ae;
    --line: #252930;
    --line-strong: #686e79;  /* 3.5:1 no painel, 3.2:1 no hover */
    --hover: #1d2026;
    --accent: #b4c2f5;
    --accent-hover: #cad4f8;
    --accent-ink: #0d1020;
    --accent-soft: #1d2336;
    --ok: #6fcf97;
    --ok-bg: #16261d;
    --warn: #e6b457;
    --warn-bg: #2a2416;
    --info-bg: #1b2030;
    --err: #f28b82;
    --err-ink: #1f0d0b;      /* branco sobre #f28b82 dava 2.4:1; este dá 7.8:1 */
    --err-bg: #2f1d1c;
    --swatch-ring: var(--line-strong); /* azul-marinho e preto somem no painel escuro sem o contorno */
    --shadow-page: 0 1px 2px rgba(0, 0, 0, 0.5), 0 14px 40px -10px rgba(0, 0, 0, 0.75);
  }

  * { box-sizing: border-box; }
  html { background: var(--bg); scrollbar-color: var(--line-strong) transparent; accent-color: var(--accent); }
  body { margin: 0; min-height: 100dvh; color: var(--text); background: var(--bg); font: var(--fs-md)/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  ::selection { background: color-mix(in srgb, var(--accent) 24%, transparent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .icon { flex: none; }
  h1, h2, h3 { margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
  h1 { font-size: var(--fs-xl); font-weight: 650; }
  h2 { font-size: var(--fs-lg); font-weight: 650; }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: var(--fs-sm); text-wrap: pretty; }

  /* ---------- barra do topo ---------- */
  .topbar { height: var(--topbar-h); display: flex; align-items: center; gap: 14px; padding: 0 20px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
  .brand { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; letter-spacing: -0.015em; padding-right: 14px; border-right: 1px solid var(--line); }
  .brand .icon { color: var(--accent); }
  .docname { min-width: 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: var(--fs-sm); }
  .docname b { color: var(--text); font-weight: 600; }
  .status { flex: none; padding: 2px 7px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); font-size: var(--fs-xs); font-weight: 600; color: var(--muted); white-space: nowrap; }
  .status.done { border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: var(--ok-bg); color: var(--ok); }
  .spacer { flex: 1; }
  .trust { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--muted); white-space: nowrap; }
  @media (max-width: 720px) { .trust { display: none; } }

  /* ---------- área de trabalho: documento + painel ---------- */
  .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 400px; height: calc(100dvh - var(--topbar-h)); }
  .desk { overflow: auto; background: var(--desk); padding: 28px 32px 36px; }
  .panel { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 1px solid var(--line); }
  .panel-body { flex: 1; overflow: auto; padding: 20px 22px 12px; }
  .panel-foot { padding: 14px 22px 18px; border-top: 1px solid var(--line); background: var(--panel); }

  .notices { display: grid; gap: 8px; max-width: 760px; margin: 0 auto 16px; }
  .notice { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--radius); font-size: var(--fs-sm); line-height: 1.45; text-wrap: pretty; }
  .notice .icon { margin-top: 1px; }
  .notice.warn { background: var(--warn-bg); } .notice.warn .icon { color: var(--warn); }
  .notice.info { background: var(--info-bg); } .notice.info .icon { color: var(--accent); }
  .notice.error { background: var(--err-bg); } .notice.error .icon { color: var(--err); }

  .stage { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  /* documento que chega pela tela: área para arrastar ou escolher o PDF */
  .dropzone { max-width: 560px; margin: 8vh auto 0; padding: 36px 28px; display: grid; justify-items: center; gap: 10px; text-align: center; background: var(--panel); border: 1.5px dashed var(--line-strong); border-radius: var(--radius); transition: border-color 0.12s, background-color 0.12s; }
  .dropzone.over { border-color: var(--accent); background: var(--accent-soft); }
  .dropzone.busy { opacity: 0.8; pointer-events: none; }
  .dropzone p { margin: 0; color: var(--muted); font-size: var(--fs-sm); text-wrap: pretty; }
  .dropzone .btn { margin-top: 6px; }
  /* o input some só da vista (como os rádios): continua no Tab e abre o seletor com Enter/Espaço */
  .file-btn { position: relative; }
  .file-btn input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .btn:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .dz-icon { width: 48px; height: 48px; display: grid; place-items: center; border-radius: var(--radius); background: var(--accent-soft); color: var(--accent); }
  .dz-note { font-size: var(--fs-xs) !important; }
  .dz-status:empty { display: none; }
  .dz-status { color: var(--text) !important; font-weight: 600; }
  .dz-status.error { color: var(--err) !important; }
  .page { position: relative; max-width: 100%; background: var(--paper); box-shadow: var(--shadow-page); }
  .page canvas { display: block; }
  .page:not(.ready) canvas { visibility: hidden; }
  .skeleton { position: absolute; inset: 0; padding: 10% 11%; display: flex; flex-direction: column; gap: 13px; overflow: hidden; }
  .skeleton i { display: block; height: 8px; background: linear-gradient(90deg, #eceef1 0%, #f5f6f8 50%, #eceef1 100%) 0 0 / 200% 100%; animation: shimmer 1.5s linear infinite; }
  .skeleton i:nth-child(3n + 1) { width: 94%; } .skeleton i:nth-child(3n + 2) { width: 86%; } .skeleton i:nth-child(3n) { width: 62%; }
  .skeleton i:first-child { width: 48%; height: 12px; margin-bottom: 12px; }
  .skeleton i:nth-child(7) { margin-top: 12px; }
  .page.ready .skeleton, .page.failed .skeleton { display: none; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* assinatura sobre a página: o que se vê é o que será carimbado */
  .sig-box { position: absolute; touch-action: none; cursor: grab; outline: 1px solid rgba(42, 68, 200, 0.45); outline-offset: 3px; transition: outline-color 0.12s, background-color 0.12s; }
  .sig-box.placeholder { outline-style: dashed; }
  .sig-box:hover, .sig-box:focus-visible, .sig-box.dragging, .sig-box.resizing { outline: 1.5px solid var(--ink-ui); outline-offset: 3px; background: rgba(42, 68, 200, 0.04); }
  .sig-box.dragging { cursor: grabbing; }
  .sig-box .art { width: 100%; height: 100%; }
  .sig-box .art svg { display: block; width: 100%; height: 100%; }
  .sig-box.placeholder .art { display: grid; place-items: center; padding: 0 6px; overflow: hidden; background: rgba(42, 68, 200, 0.06); color: var(--ink-ui); font-size: var(--fs-xs); font-weight: 600; line-height: 1.2; text-align: center; }
  /* a caixa encolhe com a prévia (painel estreito, tela embutida no chat): o texto acompanha e some antes de vazar */
  .sig-box.placeholder { container-type: size; }
  .sig-box.placeholder .art { font-size: clamp(8px, 24cqh, var(--fs-xs)); }
  @container (max-height: 26px) or (max-width: 64px) { .sig-box.placeholder .art span { display: none; } }
  .handle { position: absolute; right: -8px; bottom: -8px; width: 11px; height: 11px; background: #fff; border: 1.5px solid var(--ink-ui); cursor: nwse-resize; }
  .handle::after { content: ""; position: absolute; inset: -9px; }
  .box-remove { position: absolute; top: -14px; right: -14px; width: 24px; height: 24px; display: grid; place-items: center; padding: 0; border: 1px solid var(--ink-ui); border-radius: var(--radius-sm); background: #fff; color: var(--ink-ui); cursor: pointer; opacity: 0; transition: opacity 0.12s; }
  .sig-box:hover .box-remove, .sig-box:focus-within .box-remove, .sig-box.dragging .box-remove { opacity: 1; }
  @media (hover: none) { .box-remove { opacity: 1; } }
  .box-remove:hover { background: #eef1fb; }
  .sig-box.placeholder .box-remove, .sig-box.locked .box-remove, .sig-box.locked .handle { display: none; }
  .sig-box.locked { cursor: default; outline-color: transparent; background: none; }
  .art.landing { animation: fade 0.14s ease-out; }
  @keyframes fade { from { opacity: 0; } }
  .busy .sig-box { pointer-events: none; }

  .pager { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 6px; min-height: 32px; font-size: var(--fs-sm); color: var(--muted); font-variant-numeric: tabular-nums; }
  .icon-btn { width: 30px; height: 30px; display: grid; place-items: center; padding: 0; border: 1px solid transparent; border-radius: var(--radius); background: transparent; color: var(--text); cursor: pointer; transition: background-color 0.12s, border-color 0.12s; }
  .icon-btn:hover:not(:disabled) { background: color-mix(in srgb, var(--text) 7%, transparent); }
  .icon-btn:disabled { opacity: 0.3; cursor: default; }
  .drag-hint { display: inline-flex; align-items: center; justify-content: center; gap: 6px; margin-left: 6px; font-size: var(--fs-xs); text-align: center; text-wrap: balance; }

  /* ---------- painel ---------- */
  .group + .group { margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--line); }
  .group-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .group-label { margin: 0; font-size: var(--fs-xs); font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .group-hint { font-size: var(--fs-xs); color: var(--muted); }

  /* aviso que abre espaço sem animar layout: a linha do grid vai de 0fr a 1fr */
  .flash { display: grid; grid-template-rows: 0fr; margin: 0; font-size: var(--fs-sm); font-weight: 600; color: var(--ok); opacity: 0; transition: grid-template-rows 0.2s var(--ease-out), opacity 0.18s ease-out; }
  .flash.show { grid-template-rows: 1fr; opacity: 1; }
  .flash.error { color: var(--err); }
  .flash > span { min-height: 0; overflow: hidden; }
  .flash-row { display: flex; align-items: flex-start; gap: 7px; padding-bottom: 10px; }
  .flash-row .icon { margin-top: 2px; }
  .flash-row > span { min-width: 0; overflow-wrap: anywhere; } /* caminhos de arquivo longos quebram em vez de vazar */

  /* lista de assinaturas: uma linha por assinatura, escolha única */
  .sig-list { display: grid; gap: 6px; }
  .sig-row { position: relative; display: grid; grid-template-columns: 16px 100px minmax(0, 1fr) 30px; align-items: center; gap: 12px; min-height: 58px; padding: 8px 8px 8px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); cursor: pointer; transition: border-color 0.12s, background-color 0.12s; }
  .sig-row:hover { border-color: var(--line-strong); }
  .sig-row input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .pick { display: contents; } /* o rótulo cobre rádio, miniatura e nome; a lixeira fica fora dele */
  .radio { width: 16px; height: 16px; border: 1.5px solid var(--line-strong); border-radius: 50%; background: var(--panel); }
  .thumb { height: 40px; display: grid; place-items: center; padding: 3px 8px; background: var(--paper); border-radius: var(--radius-sm); overflow: hidden; }
  .thumb svg { max-width: 100%; max-height: 34px; width: auto; height: auto; }
  .sig-text { display: flex; flex-direction: column; min-width: 0; }
  .sig-text .name { font-size: var(--fs-sm); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sig-text .meta { font-size: var(--fs-xs); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sig-row:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
  .sig-row:has(input:checked) .radio { border: 5px solid var(--accent); }
  .sig-row:has(input:checked) .meta { color: var(--accent); font-weight: 600; }
  .sig-row:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row-del { width: 30px; height: 30px; display: grid; place-items: center; padding: 0; border: 1px solid transparent; border-radius: var(--radius); background: transparent; color: var(--muted); cursor: pointer; opacity: 0; transition: opacity 0.12s, background-color 0.12s, color 0.12s; }
  .sig-row:hover .row-del, .sig-row:focus-within .row-del, .row-del:focus-visible { opacity: 1; }
  @media (hover: none) { .row-del { opacity: 1; } }
  .row-del:hover { background: var(--err-bg); color: var(--err); }
  .sig-row.confirming { grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; cursor: default; border-color: color-mix(in srgb, var(--err) 50%, transparent); background: var(--err-bg); box-shadow: none; }
  .confirm-text { font-size: var(--fs-sm); font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sig-list.static .sig-row { grid-template-columns: 100px minmax(0, 1fr) 30px; cursor: default; }
  .sig-list.static .sig-row.confirming { grid-template-columns: minmax(0, 1fr) auto auto; }
  .empty { margin: 0; padding: 16px; border: 1px dashed var(--line-strong); border-radius: var(--radius); color: var(--muted); font-size: var(--fs-sm); text-align: center; }
  .new-sig { margin-top: 8px; width: 100%; justify-content: flex-start; }
  .new-sig[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }

  /* ---------- quadro de desenho ---------- */
  .drawer { margin-top: 12px; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); }
  .on-doc { position: absolute; top: 8px; right: 8px; display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: var(--radius-sm); background: #edf0fb; color: #1b2a84; font-size: var(--fs-xs); font-weight: 650; pointer-events: none; }
  .seg { display: inline-grid; grid-auto-flow: column; padding: 2px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--panel); }
  .seg label { position: relative; cursor: pointer; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: var(--radius-sm); font-size: var(--fs-sm); font-weight: 550; color: var(--muted); white-space: nowrap; transition: background-color 0.12s, color 0.12s; }
  .seg label:hover span { color: var(--text); }
  .seg input:checked + span { background: var(--accent); color: var(--accent-ink); }
  .seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 1px; }
  .pad { position: relative; margin-top: 10px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--paper); overflow: hidden; user-select: none; -webkit-user-select: none; transition: border-color 0.12s, box-shadow 0.12s; }
  .pad.writing { border-color: var(--ink-ui); box-shadow: 0 0 0 2px rgba(42, 68, 200, 0.18); }
  .pad canvas { display: block; width: 100%; height: 200px; cursor: crosshair; touch-action: none; }
  .pad canvas:focus-visible { outline: none; }
  .pad:has(canvas:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pad-hint { position: absolute; inset: 0 0 46px; margin: 0; display: grid; place-items: center; padding: 0 30px; color: #595f6b; font-size: var(--fs-sm); line-height: 1.45; text-align: center; text-wrap: balance; pointer-events: none; }
  .pen-status { position: absolute; top: 8px; left: 8px; display: inline-flex; align-items: center; gap: 7px; padding: 3px 8px; border-radius: var(--radius-sm); background: #edf0fb; color: #1b2a84; font-size: var(--fs-xs); font-weight: 600; pointer-events: none; opacity: 0; transition: opacity 0.12s; }
  .pen-status.on { opacity: 1; }
  .pen-status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-ui); }
  .pad-actions { margin-top: 8px; display: flex; align-items: center; gap: 4px; }
  .save-row { margin-top: 10px; display: flex; align-items: flex-end; gap: 8px; }
  .field { display: grid; gap: 4px; flex: 1; min-width: 0; }
  .field > span { font-size: var(--fs-xs); font-weight: 600; color: var(--muted); }
  input[type="text"], input[type="email"], input[type="tel"], textarea { width: 100%; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--panel); color: var(--text); font: inherit; font-size: var(--fs-md); caret-color: var(--accent); transition: border-color 0.12s, box-shadow 0.12s; }
  input[type="text"], input[type="email"], input[type="tel"] { height: 36px; }
  textarea { padding: 8px 10px; resize: vertical; line-height: 1.45; }
  input:focus-visible, textarea:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
  input::placeholder, textarea::placeholder { color: var(--muted); opacity: 1; }
  @media (pointer: coarse) { input[type="text"], input[type="email"], input[type="tel"], textarea { font-size: 16px; } } /* abaixo de 16px o iPhone dá zoom ao focar */

  /* ---------- tinta ---------- */
  .ink-grid { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 10px 14px; }
  .field-label { font-size: var(--fs-sm); color: var(--muted); }
  .swatches { display: flex; align-items: center; gap: 6px; }
  .swatch { position: relative; cursor: pointer; }
  .swatch input { position: absolute; opacity: 0; pointer-events: none; }
  .swatch span { display: block; width: 26px; height: 26px; border-radius: var(--radius-sm); background: var(--c); box-shadow: inset 0 0 0 1px var(--swatch-ring); }
  .swatch input:checked + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .swatch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 4px; }
  .ink-name { margin-left: 6px; font-size: var(--fs-sm); color: var(--text); }
  .pen-line { display: inline-block; width: 16px; border-radius: 99px; background: currentColor; }

  /* ---------- botões ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--panel); color: var(--text); font-size: var(--fs-sm); font-weight: 600; white-space: nowrap; cursor: pointer; transition: background-color 0.12s, border-color 0.12s, color 0.12s; }
  .btn:hover:not(:disabled) { background: var(--hover); border-color: color-mix(in srgb, var(--line-strong) 60%, var(--text)); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn.primary { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover:not(:disabled) { border-color: var(--accent-hover); background: var(--accent-hover); }
  .btn.danger { border-color: var(--err); background: var(--err); color: var(--err-ink); }
  .btn.danger:hover:not(:disabled) { background: color-mix(in srgb, var(--err) 85%, black); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.ghost:hover:not(:disabled) { background: var(--hover); color: var(--text); border-color: transparent; }
  .btn.small { height: 30px; padding: 0 10px; }
  .spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error { display: flex; gap: 8px; align-items: flex-start; margin: 0 0 10px; padding: 9px 11px; border-radius: var(--radius); background: var(--err-bg); font-size: var(--fs-sm); }
  .error .icon { color: var(--err); margin-top: 1px; }
  .foot-note { margin: 0 0 10px; font-size: var(--fs-sm); color: var(--muted); text-wrap: pretty; }
  .foot-note b { color: var(--text); font-weight: 600; }
  .foot-actions { display: flex; gap: 8px; }
  .foot-actions .primary { flex: 1; height: 40px; font-size: var(--fs-md); }

  /* ---------- depois de assinar: enviar ou guardar ---------- */
  .done-head { display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: start; }
  .done-mark { width: 36px; height: 36px; display: grid; place-items: center; border-radius: var(--radius); background: var(--ok-bg); color: var(--ok); }
  .done-mark.neutral { background: var(--hover); color: var(--muted); }
  .done-head p { margin: 4px 0 0; color: var(--muted); font-size: var(--fs-sm); text-wrap: pretty; }
  .done-head p b { color: var(--text); font-weight: 600; }
  .path { margin: 12px 0 0; padding: 8px 10px; border-radius: var(--radius); background: var(--bg); color: var(--muted); font: var(--fs-xs)/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
  .path + .group { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
  .actions { display: grid; gap: 6px; }
  .action { display: grid; grid-template-columns: 20px 1fr 16px; gap: 12px; align-items: center; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--text); text-align: left; cursor: pointer; transition: background-color 0.12s, border-color 0.12s; }
  .action:hover:not(:disabled) { background: var(--hover); border-color: var(--line-strong); }
  .action:disabled { opacity: 0.45; cursor: not-allowed; }
  .action .icon { color: var(--accent); }
  .a-title { display: block; font-size: var(--fs-sm); font-weight: 600; }
  .a-sub { display: block; font-size: var(--fs-xs); color: var(--muted); }
  .action .chev { color: var(--muted); transition: transform 0.15s var(--ease-out); }
  .action[aria-expanded="true"] { border-color: var(--accent); }
  .action[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .send-form { display: grid; gap: 10px; margin: -2px 0 4px; padding: 12px; border: 1px solid var(--accent); border-top: 0; border-radius: 0 0 var(--radius) var(--radius); background: var(--bg); }
  .action[aria-expanded="true"]:has(+ .send-form:not([hidden])) { border-radius: var(--radius) var(--radius) 0 0; }
  .form-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
  .form-note { margin: 0; font-size: var(--fs-xs); color: var(--muted); text-wrap: pretty; }

  /* ---------- cofre ---------- */
  .vault-main { max-width: 640px; margin: 0 auto; padding: 28px 20px 0; }
  .vault-main .group { margin-top: 24px; }
  .vault-main .pad canvas { height: 220px; }
  .vault-foot { display: flex; justify-content: flex-end; margin-top: 24px; padding: 18px 0 32px; border-top: 1px solid var(--line); }

  .fatal { max-width: 520px; margin: 12vh auto; padding: 0 20px; }
  .fatal p { color: var(--muted); }

  /* ---------- telas estreitas e embutido no chat ---------- */
  @media (max-width: 959px) {
    .workspace { grid-template-columns: 1fr; height: auto; }
    .desk { overflow: visible; padding: 16px 12px 18px; }
    .panel { border-left: 0; border-top: 1px solid var(--line); }
    .panel-body { overflow: visible; padding: 18px 16px 12px; }
    .panel-foot { position: sticky; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); box-shadow: 0 -8px 20px -14px rgba(0, 0, 0, 0.3); }
    .brand { padding-right: 10px; }
    /* empilhado, a dica ganha linha própria e reservada: aparecer no primeiro traço não empurra o quadro de desenho */
    .drag-hint { flex-basis: 100%; margin-left: 0; }
    .drag-hint[hidden] { display: inline-flex !important; visibility: hidden; }
  }
  body.embedded .drag-hint { flex-basis: 100%; margin-left: 0; }
  body.embedded .drag-hint[hidden] { display: inline-flex !important; visibility: hidden; }
  body.embedded { min-height: 0; }
  body.embedded .topbar { position: static; }
  body.embedded .workspace { grid-template-columns: 1fr; height: auto; }
  body.embedded .desk { overflow: visible; padding: 16px 12px; }
  body.embedded .panel { border-left: 0; border-top: 1px solid var(--line); }
  body.embedded .panel-body { overflow: visible; padding: 18px 16px 12px; }
  body.embedded .panel-foot { padding: 12px 16px 16px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
  }
  /* alto contraste do sistema: fundos somem, então a opção escolhida ganha contorno; a amostra de cor é o próprio conteúdo */
  @media (forced-colors: active) {
    .seg input:checked + span { outline: 2px solid Highlight; outline-offset: -2px; }
    .swatch span { forced-color-adjust: none; }
    .swatch input:checked + span { outline: 2px solid Highlight; }
  }
